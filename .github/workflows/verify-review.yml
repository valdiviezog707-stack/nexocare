name: Verify NexoCare review
on:
  push:
    branches: [fix/account-isolation-and-functional-audit]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/domain.test.cjs
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
      - run: node tests/live-preview-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexocare-browser-review
          path: test-results
